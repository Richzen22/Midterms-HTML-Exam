        <section id="contact" class="tab-content">
            <h2>Contact Me</h2>
            <form action="#" method="POST">
       
        <img src="contact.jpg" alt="Contact Avatar" style="width: 100px; height: 100px; border-radius: 50%; border: 1px solid #ccc; object-fit: cover;">
        <h2 style="margin-top: 15px; margin-bottom: 5px; color: #333;">Contact Details</h2>
        <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        <p style="margin: 0; font-size: 14px; color: #666;">Contact Form</p>

     
        <div>
            <label for="fullName" style="display: block; font-weight: bold; margin-bottom: 5px;">Full Name *</label>
            <input type="text" id="fullName" name="fullName" placeholder="Full Name" required 
                   style="width: 100px; max-width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

      
        <div>
            <label for="email" style="display: block; font-weight: bold; margin-bottom: 5px;">Email Address *</label>
            <input type="email" id="email" name="email" placeholder="Email Address" required 
                   style="width: 100px; max-width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

       
        <div>
            <label for="inquiry" style="display: block; font-weight: bold; margin-bottom: 5px;">Inquiry Topic *</label>
            <select id="inquiry" name="inquiry" required 
                    style="width: 100px; max-width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; background-color: white; box-sizing: border-box;">
                <option value="" disabled selected>-- Select Inquiry Type --</option>
                <option value="ui-design">UI Design</option>
                <option value="frontend">Front End Development</option>
                <option value="other">General Inquiry</option>
            </select>
        </div>

       
        <div>
            <label for="message" style="display: block; font-weight: bold; margin-bottom: 5px;">Message *</label>
            <textarea id="message" name="message" placeholder="How can I help you?" rows="4" required 
                      style="width: 100px; max-width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; box-sizing: border-box;"></textarea>
        </div>

      
        <button type="submit" 
                style="width: 100px; max-width: 100%; background-color: #333; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; text-align: center; margin-top: 10px;">
            Send Message
        </button>
    </form>
</div>

        <div style="text-align: center; margin-bottom: 25px;">

    <script>
        const links = document.querySelectorAll('.nav-link');
        const tabs = document.querySelectorAll('.tab-content');

        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                
            
                links.forEach(l => l.classList.remove('active'));
                tabs.forEach(t => t.classList.remove('active-tab'));
                
               
                link.classList.add('active');
                const targetId = link.getAttribute('href');
                document.querySelector(targetId).classList.add('active-tab');
            });
